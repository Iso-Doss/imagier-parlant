<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : l'app gère elle-même les bords arrondis et l'encoche (zones sûres) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Imagier parlant</title>
    <meta name="description" content="Une image, une question, un mot : l'imagier qui parle, pour apprendre les mots aux tout-petits, en français et en anglais." />

    <!-- App installable (Android, ordinateur) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E7F1FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F192C" media="(prefers-color-scheme: dark)" />

    <!-- Écran d'accueil de l'iPhone et de l'iPad -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Imagier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #E7F1FA;
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #0F192C; }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>Activez JavaScript pour utiliser Imagier parlant.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
