# Services de développement : MySQL, Redis, SeaweedFS (stockage compatible S3).
# Lancer : docker compose up -d   (ou seulement certains : docker compose up -d mysql s3)
#
# Développement uniquement : aucun mot de passe, et les ports ne sont ouverts
# que sur cette machine (127.0.0.1). Ne jamais utiliser ce fichier en production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: imagier
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  # Stockage compatible S3 (remplace S3 en local). Sans clés : accessible seulement depuis cette machine.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - s3:/data

volumes:
  mysql:
  s3:
